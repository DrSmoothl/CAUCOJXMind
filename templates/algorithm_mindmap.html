{% extends "layout/basic.html" %}
{% block content %}
<!-- 思维导图容器 -->
<div class="mindmap-fullscreen">
  <!-- 思维导图主体 -->
  <div id="mindmap" class="mindmap-canvas"></div>

  <!-- 侧边栏详情框 -->
  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h3 id="sidebar-title">标签题目列表</h3>
      <button id="sidebar-close" class="sidebar-close">&times;</button>
    </div>
    <div class="sidebar-body">
      <div id="sidebar-loading" class="sidebar-loading" style="display: none;">
        <div class="spinner"></div>
        <p>加载中...</p>
      </div>
      <div id="sidebar-content">
        <!-- 题目列表将在这里动态加载 -->
      </div>
    </div>
  </div>

  <!-- 遮罩层 -->
  <div id="overlay" class="overlay"></div>
</div>

<style>
/* 全屏容器 */
.mindmap-fullscreen {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f0f9ff 100%);
  z-index: 1000;
  overflow: hidden;
}

/* 画布 */
.mindmap-canvas {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
  cursor: default;
}

/* 侧边栏 */
.sidebar {
  position: fixed;
  right: -700px;
  top: 0;
  bottom: 0;
  width: 700px;
  background: white;
  box-shadow: -5px 0 20px rgba(0, 0, 0, 0.15);
  transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 1002;
  display: flex;
  flex-direction: column;
}

.sidebar.active {
  right: 0;
}

.sidebar-header {
  padding: 1.5rem;
  border-bottom: 2px solid #e0f2fe;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
  color: white;
}

.sidebar-header h3 {
  margin: 0;
  font-size: 1.25rem;
  font-weight: 600;
}

.sidebar-close {
  background: none;
  border: none;
  color: white;
  font-size: 2rem;
  cursor: pointer;
  padding: 0;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  transition: background 0.2s;
}

.sidebar-close:hover {
  background: rgba(255, 255, 255, 0.2);
}

.sidebar-body {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem;
}

.sidebar-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3rem;
  color: #6b7280;
}

.spinner {
  border: 3px solid #e0f2fe;
  border-top: 3px solid #38bdf8;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin-bottom: 1rem;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* 遮罩层 */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
  z-index: 1001;
}

.overlay.active {
  opacity: 1;
  pointer-events: auto;
}

/* 题目表格 */
.problem-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 1rem;
}

.problem-table thead {
  background: #f0f9ff;
  border-bottom: 2px solid #38bdf8;
}

.problem-table th {
  padding: 0.75rem;
  text-align: left;
  font-weight: 600;
  color: #0c4a6e;
  font-size: 0.875rem;
}

.problem-table td {
  padding: 0.75rem;
  border-bottom: 1px solid #e0f2fe;
  font-size: 0.875rem;
}

.problem-table tbody tr {
  transition: background 0.2s;
  cursor: pointer;
}

.problem-table tbody tr:hover {
  background: #f0f9ff;
}

.problem-pid {
  color: #0ea5e9;
  font-weight: 600;
}

.problem-title {
  color: #1e293b;
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.problem-difficulty {
  display: inline-block;
  padding: 0.25rem 0.5rem;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 600;
}

.difficulty-0 { background: #d1d5db; color: #374151; }
.difficulty-1 { background: #bbf7d0; color: #166534; }
.difficulty-2 { background: #bfdbfe; color: #1e40af; }
.difficulty-3 { background: #fde68a; color: #92400e; }
.difficulty-4 { background: #fecaca; color: #991b1b; }
.difficulty-5 { background: #e9d5ff; color: #581c87; }
.difficulty-6 { background: #fca5a5; color: #7f1d1d; }
.difficulty-7 { background: #c084fc; color: #581c87; }
.difficulty-8 { background: #fb923c; color: #7c2d12; }
.difficulty-9 { background: #f87171; color: #991b1b; }
.difficulty-10 { background: #dc2626; color: #ffffff; }

.problem-stats {
  color: #6b7280;
  font-size: 0.8rem;
}

.acceptance-rate {
  color: #059669;
  font-weight: 600;
}

.empty-message {
  text-align: center;
  padding: 3rem;
  color: #6b7280;
}

.empty-message .icon {
  font-size: 3rem;
  margin-bottom: 1rem;
  color: #cbd5e1;
}

/* 节点可点击 */
.mind-elixir me-tpc {
  cursor: pointer !important;
  user-select: none !important;
  -webkit-user-select: none !important;
  -moz-user-select: none !important;
  -ms-user-select: none !important;
}

.mind-elixir me-root {
  cursor: default !important;
}

.mind-elixir * {
  user-select: none !important;
  -webkit-user-select: none !important;
}

/* 根节点样式 */
.mind-elixir me-root {
  font-size: 1.5rem !important;
  font-weight: 700 !important;
  padding: 1.25rem 2rem !important;
  background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%) !important;
  color: white !important;
  border-radius: 1rem !important;
  box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3) !important;
  border: 3px solid rgba(255, 255, 255, 0.5) !important;
  transition: all 0.3s ease !important;
}

.mind-elixir me-root:hover {
  transform: translateY(-2px) !important;
  box-shadow: 0 15px 35px rgba(56, 189, 248, 0.4) !important;
}

/* 一级节点样式 */
.mind-elixir me-tpc[data-depth="1"] {
  font-size: 1.1rem !important;
  font-weight: 600 !important;
  padding: 0.875rem 1.5rem !important;
  background: linear-gradient(135deg, #7dd3fc 0%, #38bdf8 100%) !important;
  color: #0c4a6e !important;
  border-radius: 0.75rem !important;
  box-shadow: 0 6px 15px rgba(56, 189, 248, 0.25) !important;
  border: 2px solid rgba(255, 255, 255, 0.6) !important;
  transition: all 0.3s ease !important;
}

.mind-elixir me-tpc[data-depth="1"]:hover {
  transform: translateY(-1px) !important;
  box-shadow: 0 8px 20px rgba(56, 189, 248, 0.35) !important;
}

/* 二级节点样式 */
.mind-elixir me-tpc[data-depth="2"] {
  font-size: 0.95rem !important;
  font-weight: 500 !important;
  padding: 0.625rem 1.125rem !important;
  background: white !important;
  color: #0c4a6e !important;
  border: 2px solid #7dd3fc !important;
  border-radius: 0.5rem !important;
  box-shadow: 0 4px 10px rgba(56, 189, 248, 0.15) !important;
  transition: all 0.3s ease !important;
}

.mind-elixir me-tpc[data-depth="2"]:hover {
  border-color: #38bdf8 !important;
  background: #f0f9ff !important;
  box-shadow: 0 6px 15px rgba(56, 189, 248, 0.2) !important;
}

/* 三级及更深节点样式 */
.mind-elixir me-tpc[data-depth="3"],
.mind-elixir me-tpc[data-depth="4"] {
  font-size: 0.875rem !important;
  padding: 0.5rem 0.875rem !important;
  background: #f0f9ff !important;
  color: #0c4a6e !important;
  border: 1.5px solid #bae6fd !important;
  border-radius: 0.375rem !important;
  box-shadow: 0 2px 6px rgba(56, 189, 248, 0.1) !important;
  transition: all 0.3s ease !important;
}

.mind-elixir me-tpc[data-depth="3"]:hover,
.mind-elixir me-tpc[data-depth="4"]:hover {
  border-color: #7dd3fc !important;
  background: white !important;
  box-shadow: 0 4px 10px rgba(56, 189, 248, 0.15) !important;
}

/* 连接线样式 */
.mind-elixir svg line {
  stroke: #38bdf8 !important;
  stroke-width: 3 !important;
  opacity: 0.8 !important;
}

.mind-elixir svg path {
  stroke: #38bdf8 !important;
  stroke-width: 2.5 !important;
  opacity: 0.7 !important;
  fill: none !important;
}

/* 选中状态 */
.mind-elixir .selected {
  outline: none !important;
}

/* 禁用编辑时的光标 */
.mind-elixir me-tpc[contenteditable="false"] {
  cursor: default !important;
}

/* 展开/折叠按钮 */
.mind-elixir .plus,
.mind-elixir .minus {
  background: #38bdf8 !important;
  color: white !important;
  border: 2px solid white !important;
  box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3) !important;
  cursor: pointer !important;
}

.mind-elixir .plus:hover,
.mind-elixir .minus:hover {
  background: #0ea5e9 !important;
  transform: scale(1.1) !important;
}

/* 响应式 */
@media (max-width: 768px) {
  .sidebar {
    width: 100%;
    right: -100%;
  }
}
</style>

<script type="module">
// 从 CDN 导入 MindElixir
import MindElixir from "https://cdn.jsdelivr.net/npm/mind-elixir@^3.0.0/dist/MindElixir.js";

// 思维导图数据结构
const mindMapData = {{ mindmap_data_json | safe }};

// 自定义主题
const customTheme = {
  name: 'CAUCOJ Sky Blue',
  palette: [
    '#38bdf8', '#7dd3fc', '#0ea5e9', '#06b6d4', '#22d3ee',
    '#0284c7', '#60a5fa', '#3b82f6', '#818cf8', '#0369a1'
  ],
  cssVar: {
    '--main-color': '#38bdf8',
    '--main-bgcolor': '#ffffff',
    '--color': '#1e293b',
    '--bgcolor': '#f8fafc',
    '--panel-color': '#1e293b',
    '--panel-bgcolor': '#ffffff',
    '--panel-border-color': '#e0f2fe'
  }
};

// Mind Elixir 配置
const options = {
  el: '#mindmap',
  direction: MindElixir.SIDE,
  draggable: false,
  contextMenu: false,
  toolBar: false,
  nodeMenu: false,
  keypress: false,
  locale: 'zh_CN',
  overflowHidden: false,
  mainLinkStyle: 2,
  mouseSelectionButton: -1,
  allowUndo: false,
  editable: false,
  theme: customTheme
};

let mind;

// 中键拖拽和滚轮缩放
function setupMouseControls() {
  const mapContainer = document.querySelector('.mind-elixir');
  if (!mapContainer) return;

  let isDragging = false;
  let startX, startY;
  let initialTransform = { x: 0, y: 0, scale: 1 };

  function getCurrentTransform() {
    const svg = mapContainer.querySelector('svg.map');
    if (!svg) return { x: 0, y: 0, scale: 1 };
    
    const transform = svg.getAttribute('transform') || '';
    const scaleMatch = transform.match(/scale\(([^)]+)\)/);
    const translateMatch = transform.match(/translate\(([^,]+),([^)]+)\)/);
    
    return {
      scale: scaleMatch ? parseFloat(scaleMatch[1]) : 1,
      x: translateMatch ? parseFloat(translateMatch[1]) : 0,
      y: translateMatch ? parseFloat(translateMatch[2]) : 0
    };
  }

  function applyTransform(x, y, scale) {
    const svg = mapContainer.querySelector('svg.map');
    if (svg) {
      svg.setAttribute('transform', `translate(${x},${y}) scale(${scale})`);
    }
  }

  mapContainer.addEventListener('mousedown', (e) => {
    if (e.button === 1) {
      e.preventDefault();
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      initialTransform = getCurrentTransform();
      mapContainer.style.cursor = 'grabbing';
    }
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    e.preventDefault();
    
    const deltaX = e.clientX - startX;
    const deltaY = e.clientY - startY;
    
    applyTransform(
      initialTransform.x + deltaX,
      initialTransform.y + deltaY,
      initialTransform.scale
    );
  });

  document.addEventListener('mouseup', (e) => {
    if (e.button === 1) {
      isDragging = false;
      mapContainer.style.cursor = 'default';
    }
  });

  mapContainer.addEventListener('wheel', (e) => {
    e.preventDefault();
    e.stopPropagation();
    
    const currentTransform = getCurrentTransform();
    const delta = e.deltaY > 0 ? -0.1 : 0.1;
    let newScale = currentTransform.scale + delta;
    newScale = Math.max(0.3, Math.min(3, newScale));
    
    applyTransform(
      currentTransform.x,
      currentTransform.y,
      newScale
    );
  }, { passive: false });

  document.addEventListener('mousedown', (e) => {
    if (e.button === 1) {
      e.preventDefault();
    }
  });
}

// 侧边栏控制
function showSidebar(tag) {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const title = document.getElementById('sidebar-title');
  const loading = document.getElementById('sidebar-loading');
  const content = document.getElementById('sidebar-content');
  
  title.textContent = `标签: ${tag}`;
  sidebar.classList.add('active');
  overlay.classList.add('active');
  loading.style.display = 'flex';
  content.innerHTML = '';
  
  // 获取当前 domainId
  const domainId = 'system'; // 或从 URL 获取
  
  // 请求题目数据
  fetch(`/mindmap/api/problems?domainId=${domainId}&tag=${encodeURIComponent(tag)}`)
    .then(res => res.json())
    .then(data => {
      loading.style.display = 'none';
      
      if (!data.success || !data.problems || data.problems.length === 0) {
        content.innerHTML = `
          <div class="empty-message">
            <div class="icon">📭</div>
            <p>暂无题目包含此标签</p>
          </div>
        `;
        return;
      }
      
      // 生成题目表格
      let tableHTML = `
        <table class="problem-table">
          <thead>
            <tr>
              <th>题号</th>
              <th>标题</th>
              <th>难度</th>
              <th>通过/提交</th>
              <th>通过率</th>
            </tr>
          </thead>
          <tbody>
      `;
      
      data.problems.forEach(p => {
        const acceptanceRate = p.nSubmit > 0 
          ? ((p.nAccept / p.nSubmit) * 100).toFixed(1) 
          : '0.0';
        
        tableHTML += `
          <tr onclick="window.open('/p/${p.pid}', '_blank')">
            <td class="problem-pid">${p.pid}</td>
            <td class="problem-title" title="${p.title}">${p.title}</td>
            <td><span class="problem-difficulty difficulty-${p.difficulty}">${p.difficulty}</span></td>
            <td class="problem-stats">${p.nAccept} / ${p.nSubmit}</td>
            <td class="acceptance-rate">${acceptanceRate}%</td>
          </tr>
        `;
      });
      
      tableHTML += `
          </tbody>
        </table>
      `;
      
      content.innerHTML = tableHTML;
    })
    .catch(error => {
      loading.style.display = 'none';
      content.innerHTML = `
        <div class="empty-message">
          <div class="icon">⚠️</div>
          <p>加载失败: ${error.message}</p>
        </div>
      `;
      console.error('加载题目失败:', error);
    });
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  sidebar.classList.remove('active');
  overlay.classList.remove('active');
}

// 初始化
window.addEventListener('DOMContentLoaded', () => {
  try {
    mind = new MindElixir(options);
    mind.init(mindMapData);
    
    setTimeout(() => {
      setupMouseControls();
      
      // 为所有非根节点添加点击事件
      const allNodes = document.querySelectorAll('me-tpc');
      allNodes.forEach(node => {
        node.setAttribute('contenteditable', 'false');
        
        // 检查是否是根节点
        const isRoot = node.closest('me-root') !== null;
        
        if (!isRoot) {
          node.style.cursor = 'pointer';
          node.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const tag = node.textContent.trim();
            showSidebar(tag);
          });
        } else {
          node.style.cursor = 'default';
        }
        
        node.addEventListener('dblclick', (e) => {
          e.preventDefault();
          e.stopPropagation();
        });
      });
    }, 500);
    
    // 绑定关闭按钮和遮罩层
    document.getElementById('sidebar-close').addEventListener('click', closeSidebar);
    document.getElementById('overlay').addEventListener('click', closeSidebar);
    
    setTimeout(() => {
      mind.toCenter();
    }, 300);
    
    console.log('思维导图初始化成功');
  } catch (error) {
    console.error('思维导图初始化失败:', error);
  }
});

// 辅助函数
function getCurrentTransform() {
  const mapContainer = document.querySelector('.mind-elixir');
  if (!mapContainer) return { x: 0, y: 0, scale: 1 };
  
  const svg = mapContainer.querySelector('svg.map');
  if (!svg) return { x: 0, y: 0, scale: 1 };
  
  const transform = svg.getAttribute('transform') || '';
  const scaleMatch = transform.match(/scale\(([^)]+)\)/);
  const translateMatch = transform.match(/translate\(([^,]+),([^)]+)\)/);
  
  return {
    scale: scaleMatch ? parseFloat(scaleMatch[1]) : 1,
    x: translateMatch ? parseFloat(translateMatch[1]) : 0,
    y: translateMatch ? parseFloat(translateMatch[2]) : 0
  };
}

function applyTransform(x, y, scale) {
  const mapContainer = document.querySelector('.mind-elixir');
  if (!mapContainer) return;
  
  const svg = mapContainer.querySelector('svg.map');
  if (svg) {
    svg.setAttribute('transform', `translate(${x},${y}) scale(${scale})`);
  }
}
</script>
{% endblock %}
