<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAUCOJ 算法标签导图</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <div class="header-content">
                <h1 class="title">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                        <path d="M2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                    CAUCOJ 算法知识图谱
                </h1>
                <p class="subtitle">探索竞赛算法的完整知识体系</p>
            </div>
        </header>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="toolbar-group">
                <button class="btn btn-primary" id="btn-zoom-in">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    放大
                </button>
                <button class="btn btn-primary" id="btn-zoom-out">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    缩小
                </button>
                <button class="btn btn-secondary" id="btn-center">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 1v6m0 6v6M1 12h6m6 0h6"></path>
                    </svg>
                    居中
                </button>
                <button class="btn btn-secondary" id="btn-refresh">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"></path>
                    </svg>
                    刷新
                </button>
            </div>
            <div class="toolbar-info">
                <span class="badge">9 个主分类</span>
                <span class="badge">200+ 个标签</span>
            </div>
        </div>

        <!-- 思维导图容器 -->
        <div id="map" class="mind-map-container"></div>

        <!-- 底部信息 -->
        <footer class="footer">
            <p>💡 提示：中键拖拽移动视图 · 滚轮缩放 · 点击节点展开/折叠</p>
        </footer>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
